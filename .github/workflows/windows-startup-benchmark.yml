name: Windows Startup Benchmark

on:
  workflow_dispatch:
    inputs:
      warm_runs:
        description: Even number of warm samples per packaging mode (minimum 20)
        required: false
        default: "20"
        type: string
  pull_request:
    paths:
      - ".github/workflows/windows-startup-benchmark.yml"
      - ".github/scripts/windows_startup_benchmark.py"
      - "tests/github_ci/test_windows_startup_benchmark.py"
      - "infrastructure/deployment/packaging/release_manifest.py"
      - "opensre.spec"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENSRE_CICD: "1"

concurrency:
  group: windows-startup-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: compare onefile and onedir
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install binary build dependencies
        run: uv sync --frozen --extra release-binary --extra postgresql

      - name: Build both packaging modes from the same commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distRoot = Join-Path $env:RUNNER_TEMP "opensre-startup-binaries"
          $buildRoot = Join-Path $env:RUNNER_TEMP "opensre-startup-build"
          foreach ($mode in @("onefile", "onedir")) {
            $env:OPENSRE_PYINSTALLER_MODE = $mode
            $distPath = Join-Path $distRoot $mode
            $workPath = Join-Path $buildRoot $mode
            uv run pyinstaller opensre.spec --clean --noconfirm `
              --distpath $distPath `
              --workpath $workPath
            if ($LASTEXITCODE -ne 0) {
              throw "PyInstaller $mode build failed with exit code $LASTEXITCODE."
            }
          }

      - name: Measure isolated process launches
        shell: pwsh
        env:
          WARM_RUNS: ${{ inputs.warm_runs || '20' }}
        run: |
          $ErrorActionPreference = "Stop"
          $binaryRoot = Join-Path $env:RUNNER_TEMP "opensre-startup-binaries"
          $onefileBinary = Join-Path $binaryRoot "onefile\opensre.exe"
          $onedirBinary = Join-Path $binaryRoot "onedir\opensre\opensre.exe"
          uv run python .github/scripts/windows_startup_benchmark.py `
            --binary "onefile=$onefileBinary" `
            --binary "onedir=$onedirBinary" `
            --warm-runs $env:WARM_RUNS `
            --home-root "$env:RUNNER_TEMP\opensre-startup-homes" `
            --output-json benchmark-results\windows-startup.json `
            --output-markdown benchmark-results\windows-startup.md
          if ($LASTEXITCODE -ne 0) {
            throw "Windows startup benchmark failed with exit code $LASTEXITCODE."
          }

      - name: Smoke test both frozen layouts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binaryRoot = Join-Path $env:RUNNER_TEMP "opensre-startup-binaries"
          $binaries = [ordered]@{
            onefile = Join-Path $binaryRoot "onefile\opensre.exe"
            onedir = Join-Path $binaryRoot "onedir\opensre\opensre.exe"
          }
          $versions = @{}
          $env:OPENSRE_HOME = Join-Path $env:RUNNER_TEMP "opensre-startup-smoke-home"
          New-Item -ItemType Directory -Force -Path $env:OPENSRE_HOME | Out-Null

          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($mode in $binaries.Keys) {
              $binary = $binaries[$mode]
              $versionLines = & $binary --version
              if ($LASTEXITCODE -ne 0) { throw "$mode --version failed." }
              $versions[$mode] = ($versionLines -join "`n").Trim()
              if ([string]::IsNullOrWhiteSpace($versions[$mode])) {
                throw "$mode --version returned no version."
              }
              & $binary -h | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "$mode -h failed." }
              & $binary _package-smoke
              if ($LASTEXITCODE -ne 0) { throw "$mode _package-smoke failed." }
            }
          } finally {
            Pop-Location
          }

          $onefileVersion = $versions["onefile"]
          $onedirVersion = $versions["onedir"]
          if ($onefileVersion -ne $onedirVersion) {
            throw "Frozen layouts report different versions: onefile='$onefileVersion', onedir='$onedirVersion'."
          }
          Write-Host "Both frozen layouts report version $onefileVersion."

      - name: Publish benchmark summary
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "benchmark-results\windows-startup.md") {
            Get-Content -LiteralPath "benchmark-results\windows-startup.md" |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload raw benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
